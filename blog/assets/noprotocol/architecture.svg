<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="Reference architecture: planner, coder and critic models exchange latents inside one trust domain; a gateway decodes, scans, signs and logs everything that leaves, and talks to external agents over signed A2A or MCP">
  <title>Latent inside, legible at the edges</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d9296"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2526; font-size: 13px; }
      .h { font-size: 15px; font-weight: 600; }
      .b { font-weight: 600; }
      .s { font-size: 11.5px; fill: #5d6b6e; }
      .zone { fill: #f3f7f8; stroke: #cfdadd; stroke-width: 1.25; }
      .box { fill: #ffffff; stroke: #cfdadd; stroke-width: 1.25; }
      .key { fill: #e6f6fa; stroke: #0891b2; stroke-width: 2; }
      .ln { fill: none; stroke: #7d9296; stroke-width: 1.25; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="760" height="352" fill="#ffffff"/>

  <text class="h" x="24" y="34">Latent links stay inside the trust domain; only legible, signed messages cross it</text>

  <rect class="zone" x="24" y="64" width="440" height="232" rx="8"/>
  <text class="b" x="40" y="88">Trust domain</text>
  <text class="s" x="40" y="106">one operator, one model family, attested hardware</text>

  <g class="ln dash">
    <path d="M208 152H280" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M128 176V248H164" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M360 176V248H324" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>

  <rect class="box" x="48" y="128" width="160" height="48" rx="8"/>
  <text x="128" y="156" text-anchor="middle">Planner model</text>
  <rect class="box" x="280" y="128" width="160" height="48" rx="8"/>
  <text x="360" y="156" text-anchor="middle">Coder model</text>
  <rect class="box" x="164" y="224" width="160" height="48" rx="8"/>
  <text x="244" y="252" text-anchor="middle">Critic model</text>
  <text class="s" x="244" y="144" text-anchor="middle">latent</text>

  <g class="ln">
    <path d="M440 152H496" marker-end="url(#arr)"/>
    <path d="M616 200V248" marker-end="url(#arr)"/>
  </g>

  <rect class="key" x="496" y="128" width="240" height="72" rx="8"/>
  <text class="b" x="616" y="152" text-anchor="middle">Gateway</text>
  <text x="616" y="170" text-anchor="middle">decode to text or schema</text>
  <text x="616" y="188" text-anchor="middle">scan, sign and log</text>

  <rect class="box" x="496" y="248" width="240" height="56" rx="8"/>
  <text class="b" x="616" y="272" text-anchor="middle">External agent</text>
  <text class="s" x="616" y="290" text-anchor="middle">another vendor or organisation</text>
  <text class="s" x="628" y="228">A2A / MCP, signed</text>

  <line class="ln dash" x1="24" x2="56" y1="324" y2="324"/>
  <text class="s" x="64" y="328">latent link: KV cache or hidden state, unreadable</text>
  <line class="ln" x1="392" x2="424" y1="324" y2="324"/>
  <text class="s" x="432" y="328">legible, authenticated message</text>
</svg>
