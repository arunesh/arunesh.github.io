<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Accuracy: LVBench 66.2% on Sep 14 to 84.1% on Oct 4 against a 80.8% reference; MINERVA 51.9% to 78.1% against 76.5%; library set quality 79% to 93% against 93%">
  <title>VideoIndex results against Gemini agentic video</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2526; }
      .h { font-size: 14px; font-weight: 600; }
      .sub { font-size: 11.5px; fill: #8b9799; }
      .lab { font-size: 12px; fill: #5d6b6e; }
      .v { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .grid { stroke: #eef3f4; stroke-width: 1; }
      .axis { font-size: 10.5px; fill: #8b9799; }
    </style>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- legend -->
  <rect x="200" y="20" width="12" height="12" rx="3" fill="#bfe9f2"/>
  <text class="lab" x="218" y="30">VideoIndex, Sep 14</text>
  <rect x="340" y="20" width="12" height="12" rx="3" fill="url(#g)"/>
  <text class="lab" x="358" y="30">VideoIndex, Oct 4</text>
  <rect x="472" y="20" width="12" height="12" rx="3" fill="#a9b4b6"/>
  <text class="lab" x="490" y="30">Gemini agentic video (reference)</text>

  <!-- grid: x0=200, 100% = 480px -->
  <g>
    <line class="grid" x1="200" y1="50" x2="200" y2="390"/>
    <line class="grid" x1="296" y1="50" x2="296" y2="390"/>
    <line class="grid" x1="392" y1="50" x2="392" y2="390"/>
    <line class="grid" x1="488" y1="50" x2="488" y2="390"/>
    <line class="grid" x1="584" y1="50" x2="584" y2="390"/>
    <line class="grid" x1="680" y1="50" x2="680" y2="390"/>
    <text class="axis" x="200" y="406" text-anchor="middle">0</text>
    <text class="axis" x="296" y="406" text-anchor="middle">20</text>
    <text class="axis" x="392" y="406" text-anchor="middle">40</text>
    <text class="axis" x="488" y="406" text-anchor="middle">60</text>
    <text class="axis" x="584" y="406" text-anchor="middle">80</text>
    <text class="axis" x="680" y="406" text-anchor="middle">100%</text>
  </g>

  <!-- LVBench -->
  <text class="h" x="20" y="82">LVBench</text>
  <text class="sub" x="20" y="99">hour-long videos</text>
  <text class="sub" x="20" y="114">340 questions, accuracy</text>
  <rect x="200" y="62" width="317.8" height="20" rx="3" fill="#bfe9f2"/>
  <text class="v" x="525.8" y="76.5">66.2%</text>
  <rect x="200" y="88" width="403.7" height="20" rx="3" fill="url(#g)"/>
  <text class="v" x="611.7" y="102.5">84.1%</text>
  <rect x="200" y="114" width="387.8" height="20" rx="3" fill="#a9b4b6"/>
  <text class="v" x="595.8" y="128.5">80.8%</text>

  <!-- MINERVA -->
  <text class="h" x="20" y="192">MINERVA</text>
  <text class="sub" x="20" y="209">long videos, 13 task types</text>
  <text class="sub" x="20" y="224">310 questions, accuracy</text>
  <rect x="200" y="172" width="249.1" height="20" rx="3" fill="#bfe9f2"/>
  <text class="v" x="457.1" y="186.5">51.9%</text>
  <rect x="200" y="198" width="374.9" height="20" rx="3" fill="url(#g)"/>
  <text class="v" x="582.9" y="212.5">78.1%</text>
  <rect x="200" y="224" width="367.2" height="20" rx="3" fill="#a9b4b6"/>
  <text class="v" x="575.2" y="238.5">76.5%</text>

  <!-- Library set -->
  <text class="h" x="20" y="302">Library set</text>
  <text class="sub" x="20" y="319">30 talks, 36.6 hours</text>
  <text class="sub" x="20" y="334">28 questions, quality</text>
  <rect x="200" y="282" width="379.2" height="20" rx="3" fill="#bfe9f2"/>
  <text class="v" x="587.2" y="296.5">79%</text>
  <rect x="200" y="308" width="446.4" height="20" rx="3" fill="url(#g)"/>
  <text class="v" x="654.4" y="322.5">93%</text>
  <text class="lab" x="700" y="322.5">$0.16/q</text>
  <rect x="200" y="334" width="446.4" height="20" rx="3" fill="#a9b4b6"/>
  <text class="v" x="654.4" y="348.5">93%</text>
  <text class="lab" x="700" y="348.5">$0.41/q</text>
</svg>
