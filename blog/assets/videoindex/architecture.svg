<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="VideoIndex architecture: an indexing pipeline that runs once per video, and an agent loop that answers questions with tools over the index">
  <title>VideoIndex architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d9296"/>
    </marker>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2526; }
      .t { font-size: 13.5px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #5d6b6e; }
      .lane { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; fill: #0e7490; }
      .box { fill: #ffffff; stroke: #cfdadd; stroke-width: 1; }
      .key { fill: #e6f6fa; stroke: #0891b2; stroke-width: 1.2; }
      .ln { fill: none; stroke: #7d9296; stroke-width: 1.3; }
      .dash { stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="760" height="460" fill="#ffffff"/>
  <rect x="0" y="0" width="760" height="3" fill="url(#g)"/>

  <!-- ===== Index once ===== -->
  <text class="lane" x="20" y="30">INDEX ONCE</text>

  <rect class="box" x="20" y="48" width="130" height="50" rx="8"/>
  <text class="t" x="34" y="69">Source</text>
  <text class="s" x="34" y="86">file · URL · YouTube</text>

  <rect class="box" x="180" y="48" width="136" height="50" rx="8"/>
  <text class="t" x="194" y="69">Decode</text>
  <text class="s" x="194" y="86">sandboxed worker</text>

  <path class="ln" d="M150 73 H178" marker-end="url(#arr)"/>
  <path class="ln" d="M316 66 H358" marker-end="url(#arr)"/>
  <path class="ln" d="M316 82 H334 V128 H358" marker-end="url(#arr)"/>
  <path class="ln" d="M334 128 V192 H358" marker-end="url(#arr)"/>

  <rect class="box" x="360" y="44" width="190" height="46" rx="8"/>
  <text class="t" x="374" y="63">Speech</text>
  <text class="s" x="374" y="79">VAD → Whisper ASR → spans</text>

  <rect class="box" x="360" y="100" width="190" height="62" rx="8"/>
  <text class="t" x="374" y="119">Frames @ 1 fps</text>
  <text class="s" x="374" y="135">shots · pHash de-dup · OCR</text>
  <text class="s" x="374" y="150">SigLIP frame embeddings</text>

  <rect class="box" x="360" y="172" width="190" height="46" rx="8"/>
  <text class="t" x="374" y="191">Fine pass</text>
  <text class="s" x="374" y="207">per-shot VLM descriptions</text>

  <path class="ln" d="M550 67 H578" marker-end="url(#arr)"/>
  <path class="ln" d="M550 131 H578" marker-end="url(#arr)"/>
  <path class="ln" d="M550 195 H578" marker-end="url(#arr)"/>

  <rect class="key" x="580" y="44" width="160" height="174" rx="10"/>
  <text class="t" x="596" y="68">Index (.vidx)</text>
  <text class="s" x="596" y="92">SQLite + FTS5 text</text>
  <text class="s" x="596" y="110">text embeddings (bge)</text>
  <text class="s" x="596" y="128">frame embeddings</text>
  <text class="s" x="596" y="146">thumbnails · grids</text>
  <text class="s" x="596" y="164">shots · scenes · chapters</text>
  <text class="s" x="596" y="190">provenance on every row</text>

  <!-- divider -->
  <line x1="20" y1="244" x2="740" y2="244" stroke="#e3eaec"/>

  <!-- ===== Ask many times ===== -->
  <text class="lane" x="20" y="272">ASK MANY TIMES</text>

  <rect class="box" x="20" y="292" width="140" height="58" rx="8"/>
  <text class="t" x="34" y="315">Question</text>
  <text class="s" x="34" y="333">+ budget (calls, $)</text>

  <path class="ln" d="M160 321 H186" marker-end="url(#arr)"/>

  <rect class="key" x="188" y="284" width="196" height="74" rx="10"/>
  <text class="t" x="204" y="307">Agent loop</text>
  <text class="s" x="204" y="325">chat model calls tools,</text>
  <text class="s" x="204" y="341">reads results, repeats</text>

  <path class="ln" d="M384 308 H414" marker-end="url(#arr)"/>
  <path class="ln" d="M414 336 H386" marker-end="url(#arr)"/>

  <rect class="box" x="416" y="270" width="324" height="132" rx="10"/>
  <text class="t" x="432" y="293">Read-only tools over the index</text>
  <text class="s" x="432" y="316">search: BM25 + text-vec + frame-vec, fused (RRF)</text>
  <text class="s" x="432" y="336">find_mentions · count_mentions (exhaustive)</text>
  <text class="s" x="432" y="356">get_transcript · get_ocr · get_descriptions</text>
  <text class="s" x="432" y="376">view (frame grid) · zoom (source resolution)</text>

  <path class="ln dash" d="M660 218 V268" marker-end="url(#arr)"/>

  <path class="ln" d="M286 358 V392" marker-end="url(#arr)"/>
  <rect class="box" x="188" y="394" width="196" height="52" rx="8"/>
  <text class="t" x="204" y="415">Answer + citations</text>
  <text class="s" x="204" y="432">[video, t0–t1] for every claim</text>
</svg>
